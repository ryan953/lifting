config:
  gcp:project: ryan953-lifting-staging
  gcp:region: us-central1
  # Immutable, and this database already exists in us-west1 (prototype #1)
  lifting:firestoreLocation: us-west1
  lifting:githubRepository: ryan953/lifting
  lifting:githubBranch: main
  # A separate site from prototype #1's default one, which these projects
  # already serve. Becomes https://ryan953-lifting-staging-v3.web.app
  lifting:hostingSiteId: ryan953-lifting-staging-v3
  lifting:emailPasswordAuth: "true"
  # This project is already a Firebase project with a (default) Firestore
  # database, both from prototype #1 — adopt them rather than fail to create
  # them. Remove this line after the first successful `pulumi up`.
  lifting:adoptExisting: "true"
  #
  # Google sign-in needs an OAuth client from the Firebase console:
  #   pulumi config set lifting:googleClientId <id>
  #   pulumi config set --secret lifting:googleClientSecret <secret>
