config:
  gcp:project: ryan953-lifting-staging
  gcp:region: us-central1

  lifting:orgId: "1067333569297"
  lifting:billingAccount: 0177D2-73FB69-D1C827
  lifting:projectDisplayName: ryan953-lifting-staging

  # Immutable, and this database already exists in us-west1
  lifting:firestoreLocation: us-west1
  lifting:customDomain: lifting-staging.ryan953.com

  lifting:githubRepository: ryan953/lifting
  lifting:githubBranch: main
  lifting:emailPasswordAuth: "true"

  # First-apply adoption. These resources already exist in this project and
  # cannot be created a second time. Remove each line once `pulumi up` has
  # succeeded and they are in state.
  lifting:adoptProject: "true"      # the GCP project itself
  lifting:adoptExisting: "true"     # Firebase project + (default) Firestore
  lifting:adoptHostingSite: "true"  # default Hosting site

  # Google sign-in — never committed in plaintext, see infra/README.md:
  #   pulumi config set lifting:googleClientId <id>
  #   pulumi config set --secret lifting:googleClientSecret <secret>
