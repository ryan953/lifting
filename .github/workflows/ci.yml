name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r typecheck
      - run: pnpm -r --filter '!@lifting/rules-tests' test
      - name: Cache exercise dataset
        uses: actions/cache@v4
        with:
          path: .cache/free-exercise-db
          key: free-exercise-db-v1
      - run: pnpm catalog:build
      - run: pnpm --filter @lifting/web build
      - run: pnpm --filter @lifting/functions build
