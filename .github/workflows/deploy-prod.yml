name: Deploy prod

on:
  workflow_dispatch:

concurrency:
  group: deploy-prod
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write # OIDC for Workload Identity Federation

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: prod
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - run: pnpm -r typecheck
      - run: pnpm --filter @lifting/shared --filter @lifting/web test
      - name: Rules tests
        run: pnpm --filter @lifting/rules-tests test

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER_PROD }}
          service_account: ${{ vars.DEPLOYER_SA_PROD }}

      - name: Provision preflight
        run: GITHUB_REPO="${{ github.repository }}" ./scripts/provision.sh prod --check-only

      - name: Build
        run: pnpm build
        env:
          VITE_FIREBASE_ENV: prod
          VITE_FIREBASE_API_KEY_PROD: ${{ vars.FIREBASE_API_KEY_PROD }}

      - name: Deploy
        run: pnpm exec firebase deploy --project prod --only hosting,functions,firestore --force
